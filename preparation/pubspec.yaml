name: infinidis_prep
description: Préparation des commandes INFINIDIS Gestion pour tablette et téléphone Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  mobile_scanner: ^5.2.3
  permission_handler: ^11.3.1
  print_bluetooth_thermal: ^1.1.2
  printing: ^5.13.2
  pdf: ^3.11.1
  audioplayers: ^6.1.0
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: tool/icon.png
  min_sdk_android: 23
