name: Test installation Android 11

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/test-install.yml']

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Projet Android
        run: |
          flutter create --platforms android --org com.infinidis --project-name infinidis_pos .
          rm -f test/widget_test.dart
          python3 tool/patch_android.py
          flutter pub get

      - name: APK pour l'appareil virtuel
        run: flutter build apk --release --target-platform android-x64

      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Installer et lancer sur Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk > install.txt 2>&1; echo "::notice title=Installation::$(tr '\n' ' ' < install.txt)"
            adb logcat -c
            adb shell monkey -p com.infinidis.infinidis_pos -c android.intent.category.LAUNCHER 1 > /dev/null 2>&1; sleep 25
            if adb shell pidof com.infinidis.infinidis_pos > /dev/null; then echo "::notice title=Lancement::application en marche"; else echo "::error title=Lancement::application arretee"; fi
            adb exec-out screencap -p > ecran.png
            adb logcat -d -v brief AndroidRuntime:E flutter:E '*:S' > erreurs.txt 2>&1; echo "::notice title=Erreurs::$(head -c 3000 erreurs.txt | tr '\n' ' ')"
            adb shell dumpsys package com.infinidis.infinidis_pos > package.txt 2>&1; echo "::notice title=Paquet::$(grep -E 'versionName|versionCode|minSdk|targetSdk' package.txt | tr '\n' ' ')"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-installation
          path: |
            install.txt
            ecran.png
            erreurs.txt
