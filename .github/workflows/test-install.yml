name: Test installation Android 11

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/test-install.yml']

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Projet Android
        run: |
          flutter create --platforms android --org com.infinidis --project-name infinidis_pos .
          rm -f test/widget_test.dart
          python3 tool/patch_android.py
          flutter pub get

      - name: APK pour l'appareil virtuel
        run: flutter build apk --release --target-platform android-x64

      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Installer et lancer sur Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk 2>&1 | tee install.txt
            adb shell pm list packages | grep infinidis | tee -a install.txt
            adb logcat -c
            adb shell monkey -p com.infinidis.infinidis_pos -c android.intent.category.LAUNCHER 1
            sleep 25
            adb shell pidof com.infinidis.infinidis_pos | tee -a install.txt || echo "APPLICATION ARRETEE" | tee -a install.txt
            adb exec-out screencap -p > ecran.png
            adb logcat -d -v time '*:E' > erreurs.txt || true
            adb shell dumpsys package com.infinidis.infinidis_pos | grep -E "versionName|versionCode|minSdk|targetSdk" | tee -a install.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-installation
          path: |
            install.txt
            ecran.png
            erreurs.txt
