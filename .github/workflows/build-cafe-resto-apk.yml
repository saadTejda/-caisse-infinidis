name: APK caisse café resto

on:
  push:
    branches: [main]
    paths:
      - 'cafe-resto/**'
      - '.github/workflows/build-cafe-resto-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: cafe-resto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true

      - name: Clé de signature
        env:
          CAISSE_KEYSTORE: ${{ secrets.CAISSE_KEYSTORE }}
        run: |
          if [ -n "$CAISSE_KEYSTORE" ]; then
            echo "$CAISSE_KEYSTORE" | base64 -d > "$RUNNER_TEMP/cafe-resto.p12"
            echo "CAISSE_RESTO_KEYSTORE_FILE=$RUNNER_TEMP/cafe-resto.p12" >> "$GITHUB_ENV"
            echo "::notice title=Signature::même clé que les autres apps, paquet différent"
          else
            echo "::warning title=Signature::secret CAISSE_KEYSTORE absent, clé de test"
          fi

      - name: Dépendances
        run: flutter pub get

      - name: Vérification du code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Construction des APK (un par type d'appareil)
        env:
          CAISSE_RESTO_KEYSTORE_PASSWORD: ${{ secrets.CAISSE_KEYSTORE_PASSWORD }}
          CAISSE_RESTO_KEY_ALIAS: caisse
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }}

      - name: Renommer
        run: |
          n=${{ github.run_number }}
          out=build/app/outputs/flutter-apk
          mv "$out/app-arm64-v8a-release.apk" "cafe-resto-caisse-${n}-tablette-64bits.apk"
          mv "$out/app-armeabi-v7a-release.apk" "cafe-resto-caisse-${n}-ancien-32bits.apk"
          ls -lh cafe-resto-caisse-*.apk

      - name: Manifeste Android 14
        run: |
          set -euo pipefail
          python3 tool/android11_manifest.py cafe-resto-caisse-*.apk
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          ZIPALIGN=$(find "$SDK/build-tools" -type f -name zipalign | sort | tail -n 1)
          test -n "$ZIPALIGN"
          for apk in cafe-resto-caisse-*.apk; do
            "$ZIPALIGN" -f 4 "$apk" "$apk.aligned"
            mv "$apk.aligned" "$apk"
          done

      - name: Signature v1 pour la tablette Lenovo
        env:
          CAISSE_RESTO_KEYSTORE_PASSWORD: ${{ secrets.CAISSE_KEYSTORE_PASSWORD }}
          CAISSE_RESTO_KEY_ALIAS: caisse
        run: |
          set -euo pipefail
          if [ -z "${CAISSE_RESTO_KEYSTORE_FILE:-}" ]; then
            echo "::warning title=Signature::pas de clé, signature v1 non ajoutée"
            exit 0
          fi
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APKSIGNER=$(find "$SDK/build-tools" -type f -name apksigner | sort | tail -n 1)
          test -n "$APKSIGNER"
          # Android 11 exige la signature v2. Le gestionnaire Lenovo exige en plus
          # une signature JAR en SHA-1, et ferme la fenêtre si la signature v3 est présente.
          for apk in cafe-resto-caisse-*.apk; do
            "$APKSIGNER" sign \
              --ks "$CAISSE_RESTO_KEYSTORE_FILE" \
              --ks-type PKCS12 \
              --ks-key-alias "$CAISSE_RESTO_KEY_ALIAS" \
              --ks-pass env:CAISSE_RESTO_KEYSTORE_PASSWORD \
              --key-pass env:CAISSE_RESTO_KEYSTORE_PASSWORD \
              --min-sdk-version 1 \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled false \
              --v4-signing-enabled false \
              "$apk"
            "$APKSIGNER" verify --verbose --min-sdk-version 1 "$apk" | grep -q "v1 scheme (JAR signing): true"
            "$APKSIGNER" verify --verbose --min-sdk-version 30 "$apk" | grep -q "v2 scheme (APK Signature Scheme v2): true"
            unzip -p "$apk" META-INF/MANIFEST.MF | grep -q "SHA1-Digest:"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: cafe-resto-caisse-apk
          path: cafe-resto/cafe-resto-caisse-*.apk
          retention-days: 30

      - name: Publication (téléchargement direct sur la tablette)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cafe-resto-v1.0.${{ github.run_number }}
          name: Café Resto Caisse 1.0.${{ github.run_number }}
          body: |
            Nom dans le menu : Caisse Resto.
            Paquet Android : com.infinidis.cafe_resto.
            Compilée comme la caisse déjà installée : Android 14, signature JAR et v2.
            Nouvelle application, à côté de la caisse et de la préparation.

            Sur la tablette Lenovo, prenez le fichier « tablette-64bits ».
            Le fichier « ancien-32bits » est pour les très anciens appareils.

            Depuis le PC :
            adb install -r cafe-resto-caisse-NUMERO-tablette-64bits.apk

            Ouvrez l’app à la main. Ne pas piloter l’écran.
          files: cafe-resto/cafe-resto-caisse-*.apk
          make_latest: false
