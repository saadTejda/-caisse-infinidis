name: APK caisse

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Projet Android
        run: |
          flutter create --platforms android --org com.infinidis --project-name infinidis_pos .
          rm -f test/widget_test.dart
          python3 tool/patch_android.py

      - name: Dépendances
        run: flutter pub get

      - name: Vérification du code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Construction de l'APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Renommer
        run: mv build/app/outputs/flutter-apk/app-release.apk caisse-infinidis-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: caisse-infinidis-apk
          path: caisse-infinidis-${{ github.run_number }}.apk
          retention-days: 30
