name: APK caisse

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Clé de signature
        env:
          CAISSE_KEYSTORE: ${{ secrets.CAISSE_KEYSTORE }}
        run: |
          if [ -n "$CAISSE_KEYSTORE" ]; then
            echo "$CAISSE_KEYSTORE" | base64 -d > "$RUNNER_TEMP/caisse.p12"
            echo "CAISSE_KEYSTORE_FILE=$RUNNER_TEMP/caisse.p12" >> "$GITHUB_ENV"
            echo "::notice title=Signature::clé fixe de la caisse"
          else
            echo "::warning title=Signature::secret CAISSE_KEYSTORE absent, clé de test (désinstaller avant chaque mise à jour)"
          fi

      - name: Projet Android
        env:
          CAISSE_KEYSTORE_PASSWORD: ${{ secrets.CAISSE_KEYSTORE_PASSWORD }}
        run: |
          flutter create --platforms android --org com.infinidis --project-name infinidis_pos .
          rm -f test/widget_test.dart
          python3 tool/patch_android.py

      - name: Dépendances
        run: flutter pub get

      - name: Vérification du code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Construction des APK (un par type d'appareil)
        env:
          CAISSE_KEYSTORE_PASSWORD: ${{ secrets.CAISSE_KEYSTORE_PASSWORD }}
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      - name: Renommer
        run: |
          n=${{ github.run_number }}
          out=build/app/outputs/flutter-apk
          mv $out/app-arm64-v8a-release.apk caisse-infinidis-$n-tablette-64bits.apk
          mv $out/app-armeabi-v7a-release.apk caisse-infinidis-$n-ancien-32bits.apk
          ls -lh *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: caisse-infinidis-apk
          path: '*.apk'
          retention-days: 30

      - name: Publication (téléchargement direct sur la tablette)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Caisse INFINIDIS 1.0.${{ github.run_number }}
          body: |
            Sur la tablette, touchez le fichier « tablette-64bits » (presque toutes les tablettes et téléphones depuis 2017, dont Lenovo Tab P11).
            Le fichier « ancien-32bits » est seulement pour les très anciens appareils.
          files: '*.apk'
          make_latest: true
