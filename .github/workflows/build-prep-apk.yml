name: APK préparation

on:
  push:
    branches: [main]
    paths: ['preparation/**', '.github/workflows/build-prep-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: preparation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.3'
          cache: true

      - name: Clé de signature
        env:
          CAISSE_KEYSTORE: ${{ secrets.CAISSE_KEYSTORE }}
        run: |
          if [ -n "$CAISSE_KEYSTORE" ]; then
            echo "$CAISSE_KEYSTORE" | base64 -d > "$RUNNER_TEMP/caisse.p12"
            echo "CAISSE_KEYSTORE_FILE=$RUNNER_TEMP/caisse.p12" >> "$GITHUB_ENV"
            echo "::notice title=Signature::clé fixe (même clé que la caisse, identifiant différent)"
          else
            echo "::warning title=Signature::secret CAISSE_KEYSTORE absent, clé de test (désinstaller avant chaque mise à jour)"
          fi

      - name: Projet Android
        env:
          CAISSE_KEYSTORE_PASSWORD: ${{ secrets.CAISSE_KEYSTORE_PASSWORD }}
        run: |
          flutter create --platforms android --org com.infinidis --project-name infinidis_prep .
          rm -f test/widget_test.dart
          python3 tool/patch_android.py
          grep -nE 'kotlin.android|ndkVersion|minSdk' android/settings.gradle* android/app/build.gradle* || true

      - name: Dépendances et icône
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Vérification du code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Construction des APK (un par type d'appareil)
        env:
          CAISSE_KEYSTORE_PASSWORD: ${{ secrets.CAISSE_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi --build-number=${{ github.run_number }} 2>&1 | tee build.log

      - name: Erreur de construction (lisible sans connexion)
        if: failure()
        run: |
          test -f build.log || exit 0
          grep -nE "What went wrong|error:|Error:|FAILURE|requires|incompatible|Execution failed|> " build.log | head -n 60 > errors.txt || true
          msg=$(head -c 6000 errors.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Gradle::$msg"

      - name: Renommer
        run: |
          n=${{ github.run_number }}
          out=build/app/outputs/flutter-apk
          mv $out/app-arm64-v8a-release.apk preparation-infinidis-$n-tablette-64bits.apk
          mv $out/app-armeabi-v7a-release.apk preparation-infinidis-$n-ancien-32bits.apk
          ls -lh *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: preparation-infinidis-apk
          path: 'preparation/*.apk'
          retention-days: 30

      - name: Publication (téléchargement direct sur la tablette)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prep-v1.0.${{ github.run_number }}
          name: Préparation INFINIDIS 1.0.${{ github.run_number }}
          body: |
            Application du préparateur (s'installe à côté de la caisse). Sur la tablette, touchez le fichier « tablette-64bits ».
            Le fichier « ancien-32bits » est seulement pour les très anciens appareils.
          files: 'preparation/*.apk'
          make_latest: 'false'
