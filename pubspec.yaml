name: infinidis_pos
description: Caisse INFINIDIS Gestion pour Android (en ligne et hors ligne).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.4.0
  path: ^1.9.0
  connectivity_plus: ^6.1.0
  uuid: ^4.5.1
  mobile_scanner: ^5.2.3
  permission_handler: ^11.3.1
  print_bluetooth_thermal: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
